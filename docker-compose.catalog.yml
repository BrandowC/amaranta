# Catalog can run without the monolith, JWT keys, Sales or the shared database.
services:
  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev_password}
      POSTGRES_DB: catalog_db
    ports:
      - '127.0.0.1:${CATALOG_DB_PORT:-55432}:5432'
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalog -d catalog_db']
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build:
      context: ./apps/catalog
    environment:
      APP_ENV: ${CATALOG_APP_ENV:-dev}
      PORT: 8081
      DATABASE_URL: ${CATALOG_DATABASE_URL:-postgresql://catalog:catalog_dev_password@catalog-db:5432/catalog_db}
      CORS_ORIGIN: ${CATALOG_CORS_ORIGIN:-http://localhost:3000}
    ports:
      - '127.0.0.1:${CATALOG_PORT:-8081}:8081'
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  catalog-test-db:
    image: postgres:16
    profiles: ['test']
    environment:
      POSTGRES_USER: catalog_test
      POSTGRES_PASSWORD: catalog_test_password
      POSTGRES_DB: catalog_db
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalog_test -d catalog_db']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  catalog_pgdata:
