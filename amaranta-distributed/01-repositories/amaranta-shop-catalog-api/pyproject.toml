[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amaranta-shop-catalog-api"
version = "0.1.0"
description = "Python Catalog API extracted from the Amaranta monolith"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mongo = ["pymongo>=4.8,<5"]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
