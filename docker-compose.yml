services:
  postgres:
    image: postgres:16-alpine
    container_name: amaranta-postgres
    environment:
      POSTGRES_USER: amaranta
      POSTGRES_PASSWORD: amaranta
      POSTGRES_DB: amaranta
    ports:
      - '5432:5432'
    volumes:
      - amaranta_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amaranta -d amaranta']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: amaranta-api
    environment:
      NODE_ENV: development
      PORT: 8080
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://amaranta:amaranta@postgres:5432/amaranta
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRES_IN: 3600s
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    container_name: amaranta-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  amaranta_pgdata:
